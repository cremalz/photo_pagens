<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ateliê Fotográfico — Retratos, Ensaios e Casamentos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Forum&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#2b2b2b;
    --bg-elevated:#383838;
    --text:#dcdcdc;
    --text-muted:rgba(220,220,220,0.58);
    --accent:#6b4a34;
    --accent-bright:#a97b52;
    --divider:rgba(220,220,220,0.14);
    --display: 'Forum', serif;
    --body: 'Jost', sans-serif;
  }
 
  *{box-sizing:border-box;margin:0;padding:0;}
 
  html{scroll-behavior:smooth;}
 
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--body);
    font-weight:300;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
 
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.01ms !important; transition-duration:0.01ms !important;}
  }
 
  /* ---------- NAV ---------- */
  header.site-nav{
    position:fixed;
    top:0; left:0; right:0;
    z-index:100;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:28px 5vw;
    background:linear-gradient(to bottom, rgba(43,43,43,0.85), rgba(43,43,43,0));
    transition:background .4s ease;
  }
  header.site-nav.solid{
    background:var(--bg);
    border-bottom:1px solid var(--divider);
  }
  .logo{
    font-family:var(--display);
    font-size:1.6rem;
    letter-spacing:0.04em;
    color:var(--text);
    cursor:pointer;
    user-select:none;
  }
  .logo em{ color:var(--accent-bright); font-style:normal; }
 
  nav.categories{
    display:flex;
    gap:2.4rem;
    list-style:none;
  }
  nav.categories button{
    background:none;
    border:none;
    font-family:var(--body);
    font-size:0.78rem;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color:var(--text-muted);
    cursor:pointer;
    padding:6px 0;
    position:relative;
  }
  nav.categories button::after{
    content:"";
    position:absolute;
    left:0; bottom:0;
    height:1px;
    width:0%;
    background:var(--accent-bright);
    transition:width .3s ease;
  }
  nav.categories button:hover{ color:var(--text); }
  nav.categories button:hover::after,
  nav.categories button.active::after{ width:100%; }
  nav.categories button.active{ color:var(--text); }
 
  .nav-toggle{
    display:none;
    background:none;
    border:none;
    color:var(--text);
    font-size:1.4rem;
    cursor:pointer;
  }
 
  /* ---------- HERO CAROUSEL ---------- */
  .hero{
    position:relative;
    height:100vh;
    width:100%;
    overflow:hidden;
  }
  .hero-slide{
    position:absolute;
    inset:0;
    opacity:0;
    transition:opacity 1.1s ease;
  }
  .hero-slide.active{ opacity:1; z-index:2; }
  .hero-slide img{
    width:100%; height:100%;
    object-fit:cover;
    filter:grayscale(15%) brightness(0.72);
  }
 
  /* scanline wipe signature transition */
  .scanline{
    position:absolute;
    top:0; bottom:0;
    width:6px;
    background:var(--accent-bright);
    box-shadow:0 0 24px 4px rgba(31,122,63,0.7);
    z-index:5;
    left:-6px;
    opacity:0;
    pointer-events:none;
  }
  .scanline.run{
    animation:sweep 1.1s ease forwards;
  }
  @keyframes sweep{
    0%{ left:-6px; opacity:1; }
    100%{ left:100%; opacity:1; }
  }
 
  .hero-content{
    position:absolute;
    left:5vw; bottom:9vh;
    z-index:10;
    max-width:640px;
  }
  .hero-content .eyebrow{
    font-size:0.72rem;
    letter-spacing:0.24em;
    text-transform:uppercase;
    color:var(--accent-bright);
    display:block;
    margin-bottom:0.9rem;
  }
  .hero-content h1{
    font-family:var(--display);
    font-weight:400;
    font-size:clamp(2.2rem, 5vw, 4rem);
    line-height:1.1;
    color:var(--text);
  }
  .hero-content p{
    margin-top:1rem;
    color:var(--text-muted);
    font-size:0.95rem;
    max-width:460px;
    line-height:1.6;
  }
 
  /* film sprocket progress track */
  .hero-progress{
    position:absolute;
    right:5vw; bottom:9vh;
    z-index:10;
    display:flex;
    gap:10px;
    align-items:center;
  }
  .sprocket{
    width:34px; height:6px;
    background:rgba(220,220,220,0.16);
    position:relative;
    cursor:pointer;
    overflow:hidden;
  }
  .sprocket span{
    position:absolute; inset:0;
    background:var(--accent-bright);
    width:0%;
  }
  .sprocket.active span{ animation:fillbar 5s linear forwards; }
  @keyframes fillbar{ from{width:0%;} to{width:100%;} }
 
  .scroll-cue{
    position:absolute;
    bottom:3vh; left:50%;
    transform:translateX(-50%);
    z-index:10;
    font-size:0.68rem;
    letter-spacing:0.2em;
    text-transform:uppercase;
    color:var(--text-muted);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
  }
  .scroll-cue::after{
    content:"";
    width:1px; height:26px;
    background:var(--divider);
  }
 
  /* ---------- GALLERY ---------- */
  .gallery-section{
    padding:7vh 5vw 10vh;
    min-height:60vh;
  }
  .gallery-header{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:1rem;
    margin-bottom:3rem;
    border-bottom:1px solid var(--divider);
    padding-bottom:1.6rem;
  }
  .gallery-header h2{
    font-family:var(--display);
    font-weight:400;
    font-size:clamp(2rem, 4vw, 3rem);
  }
  .gallery-header .count{
    font-size:0.78rem;
    letter-spacing:0.12em;
    color:var(--text-muted);
    text-transform:uppercase;
  }
 
  .masonry{
    column-count:3;
    column-gap:1.4rem;
  }
  .masonry figure{
    break-inside:avoid;
    margin:0 0 1.4rem;
    position:relative;
    overflow:hidden;
    background:var(--bg-elevated);
  }
  .masonry img{
    width:100%; display:block;
    transition:transform .6s ease, filter .6s ease;
    filter:grayscale(10%) brightness(0.9);
  }
  .masonry figure:hover img{
    transform:scale(1.04);
    filter:grayscale(0%) brightness(1);
  }
 
  .empty-hint{
    text-align:center;
    padding:6vh 0;
    color:var(--text-muted);
    font-size:0.85rem;
    display:none;
  }
  .gallery-section.empty .empty-hint{ display:block; }
  .gallery-section.empty .masonry{ display:none; }
 
  footer{
    padding:4vh 5vw;
    border-top:1px solid var(--divider);
    display:flex;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:1rem;
    font-size:0.72rem;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--text-muted);
  }
 
  @media (max-width: 900px){
    .masonry{ column-count:2; }
    nav.categories{
      position:fixed;
      top:0; right:0;
      height:100vh;
      width:74vw;
      background:var(--bg);
      flex-direction:column;
      justify-content:center;
      align-items:flex-start;
      padding:0 8vw;
      gap:2rem;
      transform:translateX(100%);
      transition:transform .4s ease;
      border-left:1px solid var(--divider);
    }
    nav.categories.open{ transform:translateX(0); }
    .nav-toggle{ display:block; }
    .hero-progress{ display:none; }
  }
  @media (max-width: 560px){
    .masonry{ column-count:1; }
  }
</style>
</head>
<body>
 
<header class="site-nav" id="siteNav">
  <div class="logo" onclick="showHero()"><em>M</em>inha Princesa Fotografia</div>
  <button class="nav-toggle" id="navToggle" aria-label="Abrir menu">&#9776;</button>
  <nav class="categories" id="categories">
    <button data-cat="artistico">Artístico</button>
    <button data-cat="gestante">Gestante</button>
    <button data-cat="casal">Casal</button>
    <button data-cat="profissional">Profissional</button>
  </nav>
</header>
 
<section class="hero" id="hero">
  <div class="scanline" id="scanline"></div>
  <!-- slides injected by JS -->
  <div class="hero-content">
    <span class="eyebrow" id="heroEyebrow">São Paulo, Brasil</span>
    <h1 id="heroTitle">Cada olhar guarda uma história</h1>
    <p id="heroSubtitle">Ensaios artísticos, gestantes, casais e retratos profissionais — capturados com luz, tempo e verdade.</p>
  </div>
  <div class="hero-progress" id="heroProgress"></div>
  <div class="scroll-cue">Deslize</div>
</section>
 
<section class="gallery-section" id="gallerySection" style="display:none;">
  <div class="gallery-header">
    <h2 id="galleryTitle">Categoria</h2>
    <span class="count" id="galleryCount">0 fotos</span>
  </div>
  <div class="masonry" id="masonry"></div>
  <p class="empty-hint">Nenhuma foto nesta categoria ainda.</p>
</section>
 
<footer>
  <span>&copy; 2026 Minha Princesa Fotografia</span>
  <span>São Paulo · Brasil</span>
</footer>
 
<script>
  // ---------- DATA (troque pelas fotos reais / content/fotos.json depois) ----------
  const CATEGORY_LABELS = {
    artistico: "Artístico",
    gestante: "Gestante",
    casal: "Casal",
    profissional: "Profissional"
  };
 
  const PHOTOS = [
    { id:1, cat:"artistico", url:"https://picsum.photos/id/1011/900/1200" },
    { id:2, cat:"artistico", url:"https://picsum.photos/id/1027/900/700" },
    { id:3, cat:"artistico", url:"https://picsum.photos/id/1005/900/1100" },
    { id:4, cat:"gestante", url:"https://picsum.photos/id/1062/900/1200" },
    { id:5, cat:"gestante", url:"https://picsum.photos/id/1074/900/900" },
    { id:6, cat:"gestante", url:"https://picsum.photos/id/1080/900/1300" },
    { id:7, cat:"casal", url:"https://picsum.photos/id/1043/900/1000" },
    { id:8, cat:"casal", url:"https://picsum.photos/id/1050/900/1200" },
    { id:9, cat:"casal", url:"https://picsum.photos/id/1057/900/750" },
    { id:10, cat:"profissional", url:"https://picsum.photos/id/1084/900/1100" },
    { id:11, cat:"profissional", url:"https://picsum.photos/id/1082/900/900" },
    { id:12, cat:"profissional", url:"https://picsum.photos/id/1069/900/1250" }
  ];
 
  // 5 fotos em destaque no carrossel do hero — vitrine geral do trabalho,
  // sem vínculo direto com as categorias do menu
  const HERO_SLIDES = [
    { url:"https://picsum.photos/id/1015/1600/1000", eyebrow:"Portfólio", title:"Cada olhar guarda uma história", text:"Um recorte do que a lente já registrou." },
    { url:"https://picsum.photos/id/1039/1600/1000", eyebrow:"Portfólio", title:"Luz, tempo e verdade", text:"Momentos que não voltam, capturados uma vez." },
    { url:"https://picsum.photos/id/1041/1600/1000", eyebrow:"Portfólio", title:"Fotografia com intenção", text:"Cada imagem carrega uma decisão consciente." },
    { url:"https://picsum.photos/id/1059/1600/1000", eyebrow:"São Paulo, Brasil", title:"Sensibilidade em cada clique", text:"Um olhar autoral sobre pessoas e instantes." },
    { url:"https://picsum.photos/id/1069/1600/1000", eyebrow:"Portfólio", title:"O melhor de cada ensaio", text:"Um convite para conhecer o trabalho completo." }
  ];
 
  // ---------- HERO CAROUSEL ----------
  const hero = document.getElementById('hero');
  const heroProgress = document.getElementById('heroProgress');
  const scanline = document.getElementById('scanline');
  let heroIndex = 0;
  let heroTimer = null;
 
  HERO_SLIDES.forEach((s, i) => {
    const slide = document.createElement('div');
    slide.className = 'hero-slide' + (i === 0 ? ' active' : '');
    slide.dataset.index = i;
    slide.innerHTML = `<img src="${s.url}" alt="${s.eyebrow} — ${s.title}">`;
    hero.insertBefore(slide, hero.firstChild);
 
    const dot = document.createElement('div');
    dot.className = 'sprocket' + (i === 0 ? ' active' : '');
    dot.innerHTML = '<span></span>';
    dot.addEventListener('click', () => goToSlide(i));
    heroProgress.appendChild(dot);
  });
 
  function updateHeroText(i){
    document.getElementById('heroEyebrow').textContent = HERO_SLIDES[i].eyebrow;
    document.getElementById('heroTitle').textContent = HERO_SLIDES[i].title;
    document.getElementById('heroSubtitle').textContent = HERO_SLIDES[i].text;
  }
 
  function goToSlide(i){
    const slides = document.querySelectorAll('.hero-slide');
    slides[heroIndex].classList.remove('active');
    slides[i].classList.add('active');
    document.querySelectorAll('.sprocket').forEach((d, idx) => d.classList.toggle('active', idx === i));
    scanline.classList.remove('run'); void scanline.offsetWidth; scanline.classList.add('run');
    updateHeroText(i);
    heroIndex = i;
    restartAutoplay();
  }
 
  function nextSlide(){ goToSlide((heroIndex + 1) % HERO_SLIDES.length); }
 
  function restartAutoplay(){
    clearInterval(heroTimer);
    heroTimer = setInterval(nextSlide, 5000);
  }
  restartAutoplay();
  hero.addEventListener('mouseenter', () => clearInterval(heroTimer));
  hero.addEventListener('mouseleave', restartAutoplay);
 
  // ---------- CATEGORY FILTER / MASONRY ----------
  const gallerySection = document.getElementById('gallerySection');
  const masonry = document.getElementById('masonry');
  const galleryTitle = document.getElementById('galleryTitle');
  const galleryCount = document.getElementById('galleryCount');
 
  document.querySelectorAll('nav.categories button').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('nav.categories button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      showCategory(btn.dataset.cat);
      document.getElementById('categories').classList.remove('open');
    });
  });
 
  function showCategory(cat){
    hero.style.display = 'none';
    clearInterval(heroTimer);
    gallerySection.style.display = 'block';
    galleryTitle.textContent = CATEGORY_LABELS[cat];
    const items = PHOTOS.filter(p => p.cat === cat);
    galleryCount.textContent = `${items.length} foto${items.length === 1 ? '' : 's'}`;
    gallerySection.classList.toggle('empty', items.length === 0);
    masonry.innerHTML = items.map(p => `
      <figure>
        <img src="${p.url}" alt="${p.caption} — ${CATEGORY_LABELS[cat]}" loading="lazy">
        <figcaption>${p.caption}</figcaption>
      </figure>
    `).join('');
    window.scrollTo({ top: 0, behavior:'smooth' });
  }
 
  function showHero(){
    document.querySelectorAll('nav.categories button').forEach(b => b.classList.remove('active'));
    gallerySection.style.display = 'none';
    hero.style.display = 'block';
    restartAutoplay();
    window.scrollTo({ top: 0, behavior:'smooth' });
  }
 
  // ---------- NAV MOBILE + SCROLL SOLID BG ----------
  document.getElementById('navToggle').addEventListener('click', () => {
    document.getElementById('categories').classList.toggle('open');
  });
  window.addEventListener('scroll', () => {
    document.getElementById('siteNav').classList.toggle('solid', window.scrollY > 40);
  });
 
  updateHeroText(0);
</script>
</body>
</html>
